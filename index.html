<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lodger Computer Person</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <div id="stage">
        <canvas id="house" width="320" height="240" aria-label="Cutaway view of the house. Click him to pat him on the head."></canvas>
        <div id="bubble" hidden></div>
        <div id="caption" hidden aria-hidden="true"></div>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="speech-log" class="visually-hidden" aria-live="polite"></div>

      <form id="intro" hidden>
        <p id="intro-text"></p>
        <label>What's your name? <input id="player-name" autocomplete="given-name" maxlength="20" required /></label>
        <label>Call him something else? <input id="tenant-name" maxlength="20" /></label>
        <button type="submit">Say hello</button>
      </form>

      <form id="talk">
        <label for="talk-input" class="visually-hidden">Say something to him</label>
        <input id="talk-input" maxlength="120" autocomplete="off" placeholder="Say something… e.g. “please play the piano”" />
        <button type="submit">Say</button>
      </form>

      <div id="actions" role="toolbar" aria-label="Things you can do">
        <button data-command="deliver:food" title="Alt+F">Food</button>
        <button data-command="deliver:water" title="Alt+W">Water</button>
        <button data-command="deliver:dogFood" title="Alt+D">Dog food</button>
        <button data-command="deliver:record" title="Alt+R">Record</button>
        <button data-command="deliver:book" title="Alt+B">Book</button>
        <button data-command="pat" title="Alt+T, or click him">Pat</button>
        <button data-command="phone" title="Alt+P">Phone</button>
        <button data-command="alarm" title="Alt+A">Alarm</button>
      </div>
      <p id="supplies"></p>

      <pre id="debug" hidden></pre>
      <p class="hint">
        Shortcuts: <kbd>Alt</kbd>+<kbd>F</kbd> food, <kbd>W</kbd> water, <kbd>D</kbd> dog food, <kbd>R</kbd> record, <kbd>B</kbd> book,
        <kbd>T</kbd> pat, <kbd>P</kbd> phone, <kbd>A</kbd> alarm. <kbd>Alt</kbd>+<kbd>N</kbd> needs panel, <kbd>Alt</kbd>+<kbd>G</kbd> floor graph.
        URL: <code>?seed=123</code>, <code>?speed=1</code> (real time; default 30), <code>?quick</code>, <code>?movedIn</code>.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
